<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" fill="none">
    <defs>
        <linearGradient id="prism-chevron1" x1="32" y1="32" x2="144" y2="192" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#FF385C" />
            <stop offset="100%" stop-color="#E11D48" />
        </linearGradient>
        <linearGradient id="prism-chevron2" x1="224" y1="224" x2="112" y2="64" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#FB7185" />
            <stop offset="100%" stop-color="#9F1239" />
        </linearGradient>
        <linearGradient id="prism-inner" x1="90" y1="90" x2="160" y2="160" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#E11D48" />
            <stop offset="100%" stop-color="#4C0519" />
        </linearGradient>
    </defs>
    <!-- Pure AMOLED Black Base with Carbon Border -->
    <rect x="8" y="8" width="240" height="240" rx="54" fill="#000000" stroke="#291518" stroke-width="4" />
    
    <!-- The Quantum Prism Monogram 'N' (Scaled from 128x128 to 256x256) -->
    <g transform="translate(32, 32) scale(1.5)">
        <!-- Left Wing -->
        <path d="M22 20 L58 20 L38 88 L18 88 Z" fill="url(#prism-chevron1)" />
        <path d="M58 20 L78 68 L58 68 L38 20 Z" fill="#FDA4AF" opacity="0.85" />
        <!-- Right Wing -->
        <path d="M106 108 L70 108 L90 40 L110 40 Z" fill="url(#prism-chevron2)" />
        <path d="M70 108 L50 60 L70 60 L90 108 Z" fill="#F43F5E" opacity="0.85" />
        <!-- Center Negative-Space Facet -->
        <polygon points="50,60 78,68 64,104" fill="url(#prism-inner)" opacity="0.6" />
        <!-- High-Precision Center Node -->
        <circle cx="64" cy="64" r="3.5" fill="#FFFFFF" />
    </g>
</svg>
