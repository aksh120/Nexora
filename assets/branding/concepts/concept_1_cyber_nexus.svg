<svg viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="nexus-left" x1="20" y1="24" x2="64" y2="104" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#0066FF" />
    </linearGradient>
    <linearGradient id="nexus-diag" x1="36" y1="24" x2="92" y2="104" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="50%" stop-color="#7000FF" />
      <stop offset="100%" stop-color="#FF007A" />
    </linearGradient>
    <linearGradient id="nexus-right" x1="64" y1="24" x2="108" y2="104" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#0044CC" />
    </linearGradient>
    <filter id="glow-nexus" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background subtle hexagon guide -->
  <polygon points="64,10 112,38 112,90 64,118 16,90 16,38" fill="none" stroke="rgba(0, 229, 255, 0.15)" stroke-width="1.5" stroke-dasharray="4 3" />
  <!-- Left Upright Pillar -->
  <path d="M28 36 L48 24 L48 88 L28 100 Z" fill="url(#nexus-left)" />
  <path d="M48 24 L56 29 L56 93 L48 88 Z" fill="#003D99" opacity="0.6" />
  <!-- Dynamic Diagonal Slice -->
  <path d="M48 24 L80 84 L64 94 L32 34 Z" fill="url(#nexus-diag)" filter="url(#glow-nexus)" />
  <!-- Right Upright Pillar -->
  <path d="M80 28 L100 40 L100 104 L80 92 Z" fill="url(#nexus-right)" />
  <path d="M72 33 L80 28 L80 92 L72 97 Z" fill="#0055FF" opacity="0.8" />
  <!-- Center Cyan Spark Core -->
  <circle cx="64" cy="64" r="3.5" fill="#FFFFFF" />
  <circle cx="64" cy="64" r="7" fill="#00F0FF" opacity="0.4" />
</svg>
