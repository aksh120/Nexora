[package]
name = "nexora"
version = "0.1.0"
edition = "2021"
authors = ["Nexora Development Team"]
description = "Ultra-Lightweight, Streaming-First Desktop Browser"
default-run = "Nexora"

[[bin]]
name = "Nexora"
path = "src/main.rs"

[dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Controls",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_WinRT",
    "Win32_System_Registry",
    "Win32_Security",
] }
webview2-com = "0.33"
# rusqlite = { version = "0.32", features = ["bundled-windows"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
directories = "5.0"

# [build-dependencies]
# winres = "0.1"

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
